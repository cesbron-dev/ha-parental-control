homework_done:
  fields:
    kid_id: &kid_id
      required: true
      example: hugo
      selector:
        text:
    code: &code
      required: false
      selector:
        text:
          type: password

add_bonus:
  fields:
    minutes: &minutes
      required: true
      example: 15
      selector:
        number:
          min: 1
          max: 240
          step: 1
          unit_of_measurement: min
          mode: box
    kid_id:
      required: false
      example: hugo
      selector:
        text:
    resource_id: &resource_id
      required: false
      example: tv
      selector:
        text:
    code: *code

exception:
  fields:
    open:
      required: true
      example: true
      selector:
        boolean:
    resource_id: *resource_id
    kid_id:
      required: false
      example: hugo
      selector:
        text:
    service:
      required: false
      example: youtube
      selector:
        text:
    minutes:
      required: false
      example: 30
      selector:
        number:
          min: 1
          max: 240
          step: 1
          unit_of_measurement: min
          mode: box
    code: *code

cancel_exception:
  fields:
    exception_id:
      required: true
      selector:
        text:
    code: *code

start_timer:
  fields:
    kid_id: *kid_id
    minutes: *minutes
    code: *code

stop_timer:
  fields:
    kid_id: *kid_id

pause:
  fields:
    active:
      required: true
      example: true
      selector:
        boolean:
    code: *code

import_config:
  fields:
    config:
      required: true
      selector:
        object:

request:
  fields:
    kind:
      required: true
      example: open
      selector:
        select:
          options:
            - open
            - bonus
            - homework
            - timer
    kid_id: *kid_id
    resource_id: *resource_id
    service:
      required: false
      example: youtube
      selector:
        text:
    minutes:
      required: false
      example: 30
      selector:
        number:
          min: 1
          max: 240
          step: 1
          unit_of_measurement: min
          mode: box
    options:
      required: false
      example: "[15, 30, 60, null]"
      selector:
        object:
    replace:
      required: false
      example: "[]"
      selector:
        object:
